[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-haggle"
version = "0.1.0"
description = "D&D 5e Dynamic Haggle & Bargain System"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
dnd-haggle = "dnd_haggle.cli:main"

[tool.setuptools]
packages = ["dnd_haggle"]

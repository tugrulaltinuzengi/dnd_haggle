plugins {
    id 'com.android.application'
}

// Sunucu adresi APK'ya gömülebilir: gradle assembleDebug -PpazarUrl=https://pazar-xxxx.onrender.com
// Verilmezse uygulama ilk açılışta adresi sorar.
def pazarUrl = (project.findProperty('pazarUrl') ?: System.getenv('PAZAR_URL') ?: '').toString()

android {
    namespace 'app.pazar'
    compileSdk 35

    // Sabit imza: her derleme aynı anahtarla imzalanır, böylece yeni APK eskisinin üstüne kurulabilir.
    // (Yalnızca kişisel/debug kullanım içindir, Play Store anahtarı değildir.)
    signingConfigs {
        debug {
            storeFile file('pazar-debug.keystore')
            storePassword 'pazar-debug'
            keyAlias 'pazar-debug'
            keyPassword 'pazar-debug'
            // v1'den v3'e tüm imza şemaları: en katı kurucular (OEM, eski Android 7.x) için en uyumlu
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    defaultConfig {
        applicationId 'app.pazar'
        minSdk 24
        targetSdk 34
        // Sürüm numarası CI çalışma numarasıyla artar: aynı ya da düşük numaralı APK üstüne kurulamaz.
        def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode 100 + runNo
        versionName "0.13.${runNo}"
        buildConfigField 'String', 'DEFAULT_URL', "\"${pazarUrl.replace('\\', '\\\\').replace('"', '\\"')}\""
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

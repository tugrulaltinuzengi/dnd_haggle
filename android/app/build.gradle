plugins {
    id 'com.android.application'
}

// Sunucu adresi APK'ya gömülebilir: gradle assembleDebug -PpazarUrl=https://pazar-xxxx.onrender.com
// Verilmezse uygulama ilk açılışta adresi sorar.
def pazarUrl = (project.findProperty('pazarUrl') ?: System.getenv('PAZAR_URL') ?: '').toString()

android {
    namespace 'app.pazar'
    compileSdk 34

    // Sabit imza (isteğe bağlı): PAZAR_KEYSTORE_FILE / _PASSWORD / _ALIAS ortam değişkenleri verilirse
    // her derleme aynı anahtarla imzalanır ve yeni APK eskisinin üstüne kurulur. Verilmezse Android'in
    // varsayılan debug anahtarı kullanılır. Anahtar depoya GİRMEZ (bkz. .gitignore).
    if (System.getenv('PAZAR_KEYSTORE_FILE')) {
        signingConfigs {
            debug {
                storeFile file(System.getenv('PAZAR_KEYSTORE_FILE'))
                storePassword System.getenv('PAZAR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PAZAR_KEYSTORE_ALIAS') ?: 'pazar-debug'
                keyPassword System.getenv('PAZAR_KEYSTORE_PASSWORD')
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    defaultConfig {
        applicationId 'app.pazar'
        minSdk 24
        targetSdk 34
        // Sürüm numarası CI çalışma numarasıyla artar: aynı ya da düşük numaralı APK üstüne kurulamaz.
        def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode runNo
        versionName "0.12.${runNo}"
        buildConfigField 'String', 'DEFAULT_URL', "\"${pazarUrl.replace('\\', '\\\\').replace('"', '\\"')}\""
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

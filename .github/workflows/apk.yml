name: APK

# android/ değişince ya da elle (Actions → APK → Run workflow) çalışır.
# Çıktı: çalışmanın altındaki "pazar-apk" çıktısı (giriş yapmış kullanıcılara açık, herkese açık release yok).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Render adresi (boş bırakılırsa uygulama ilk açılışta sorar)"
        required: false
        default: ""
  push:
    paths: ["android/**", ".github/workflows/apk.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Optional stable signing key: add repo secrets PAZAR_KEYSTORE_B64 and
      # PAZAR_KEYSTORE_PASSWORD. Without them the default debug key is used.
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.PAZAR_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/pazar.keystore"
            echo "PAZAR_KEYSTORE_FILE=$RUNNER_TEMP/pazar.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        working-directory: android
        env:
          PAZAR_URL: ${{ inputs.url }}
          PAZAR_KEYSTORE_PASSWORD: ${{ secrets.PAZAR_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pazar.apk

      - name: Verify APK (imza, paket, boyut)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/apksigner" verify --verbose --print-certs pazar.apk
          "$BT/aapt2" dump badging pazar.apk | grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion|uses-permission|application-label|application-icon|launchable-activity|native-code|supports-)"
          unzip -l pazar.apk
          ls -l pazar.apk
          sha256sum pazar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pazar-apk
          path: pazar.apk
